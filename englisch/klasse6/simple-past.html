<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7C5CFF">
<title>Time Travel Agency – Simple Past</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../lernwelt/lernwelt.css">
<style>
:root{
  color-scheme:light;
  --ink:#1E1B4B; --bg:#BFE5FF; --surface:#FFFFFF; --surface-2:#F1F8FF; --muted:#55527A; --line:#1E1B4B;
  --accent:#FF5A4E; --accent-ink:#FFFFFF; --accent-2:#FFD23F; --mid-bg:#FFF3C0; --violet:#7C5CFF;
  --ok:#139A65; --ok-bg:#D4F5E5; --bad:#E0362C; --bad-bg:#FFE1DE;
  --radius:22px; --radius-btn:16px; --radius-ic:16px;
  --border:3px solid var(--ink); --shadow:5px 5px 0 var(--ink);
  --border-btn:3px solid var(--ink); --shadow-btn:4px 4px 0 var(--ink); --border-opt:3px solid var(--ink);
  --border-ic:3px solid var(--ink); --border-bin:3px dashed var(--ink); --border-soft:3px solid var(--ink);
  --font-body:"Lexend",system-ui,-apple-system,sans-serif;
  --font-display:"Fredoka","Lexend",system-ui,sans-serif; --display-weight:700;
  --ic-bg:var(--accent-2); --card-back:var(--violet); --tile-bg:var(--accent-2); --tile-ink:var(--ink);
  --chip-bg:var(--accent-2); --chip-ink:var(--ink); --how-bg:#FFFFFF;
  --track:#DCEBFA; --star:#FFB800; --star-off:#C9D9EA; --focus:var(--violet);
}
body{background-color:var(--bg);background-image:radial-gradient(#9CCFF2 1.6px,transparent 1.6px);background-size:22px 22px}
.panel{border-width:3px}
.btn{text-shadow:none}
.mcard .f{font-size:2.2rem}
.prom,.opt{box-shadow:3px 3px 0 var(--ink)}
.opt:active,.btn:active{box-shadow:1px 1px 0 var(--ink);transform:translate(3px,3px)}
.slot.filled{border-color:var(--ink)}
.how{box-shadow:4px 4px 0 var(--ink)}
.lvl:nth-child(4n+2) .ic{background:#FF9BB3} .lvl:nth-child(4n+3) .ic{background:#8EE3C8} .lvl:nth-child(4n+4) .ic{background:#B9A8FF}
.lvl.final .ic{background:var(--accent)}

.tta{position:relative;overflow:hidden;background:var(--violet);color:#fff;border:var(--border);border-radius:28px;box-shadow:var(--shadow);
  padding:clamp(1.4rem,4vw,2.4rem);min-height:240px;isolation:isolate}
.tta .tag{display:inline-block;background:var(--accent-2);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:.15rem .8rem;font-weight:700;transform:rotate(-2deg)}
.tta h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.5rem,8.5vw,4.6rem);line-height:.95;margin:.6rem 0 .6rem;max-width:10ch}
.tta p{margin:0;max-width:34ch;font-size:1.08rem;color:#EEE9FF}
.tta svg{position:absolute;right:clamp(-40px,1vw,20px);top:50%;transform:translateY(-50%);width:clamp(160px,32vw,270px);z-index:-1}
@media (max-width:560px){ .tta svg{opacity:.35} }
@media (prefers-reduced-motion: no-preference){ .tta .hand{transform-origin:100px 100px;animation:rewind 6s linear infinite} }
@keyframes rewind{to{transform:rotate(-360deg)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="uk-s"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
    <clipPath id="uk-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
    <g id="ukflag" clip-path="url(#uk-s)">
      <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
      <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
      <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/>
      <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
      <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
    </g>
  </defs>
</svg>
<main class="lw" id="app"></main>

<script src="../../qrcode.js"></script>
<script src="../../ergebnis.js"></script>
<script src="../../lernwelt/lernwelt.js"></script>
<script>
const UK = `<svg class="ico-flag" viewBox="0 0 60 30" aria-hidden="true"><use href="#ukflag"/></svg>`;
const HERO = `
<div class="tta">
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <path d="M100 8 A92 92 0 1 0 192 100" fill="none" stroke="#FFD23F" stroke-width="10" stroke-linecap="round"/>
    <path d="M192 100 l-16 -14 M192 100 l14 -16" stroke="#FFD23F" stroke-width="10" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="70" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="6"/>
    <g stroke="#1E1B4B" stroke-width="6" stroke-linecap="round">

    <circle cx="100" cy="100" r="8" fill="#1E1B4B"/>
  </svg>
  <span class="tag">English · Class 6</span>
  <h1>Time Travel Agency</h1>

LW.start({
  id: "sp6",
  titel: "Time Travel Agency – Simple Past",
  insel: { k:6, href:"../insel.html?k=6" },

  lob: {3:"Amazing! You are a real time traveller.", 2:"Great job! Can you get three stars next time?", 1:"Good start – try again and you will get better.", 0:"Don’t give up! Read the tips and try again."},
  levels: [
    { id:"signal", typ:"swipe", icon:"🦖", titel:"Dino Valley", art:"Signal words · swipe",
      anleitung:"Past or present? Swipe **right for Past** and **left for Present**.",
      anleitungDe:"Vergangenheit oder Gegenwart? Wische nach **rechts für Past** (Vergangenheit) und nach **links für Present** (Gegenwart). Du kannst auch auf die Knöpfe tippen.",
      tipp:"Signalwörter wie *yesterday* oder *ago* zeigen dir: Das ist Vergangenheit.",
      links:{t:"Present", icon:"🔁"}, rechts:{t:"Past", icon:"⏪"},
      karten:[
        {t:"yesterday", r:"r", e:"**Yesterday** = gestern → simple past."},
        {t:"every day", r:"l", e:"**Every day** = jeden Tag → something you do again and again: simple present."},
        {t:"last summer", r:"r", e:"**last** + time (last week, last year …) → simple past."},
        {t:"always", r:"l", e:"**Always** → a habit: simple present."},
        {t:"two days ago", r:"r", e:"**ago** = vor (zeitlich) → simple past."},
        {t:"usually", r:"l", e:"**Usually** → a habit: simple present."},
        {t:"in 2015", r:"r", e:"A year in the past → simple past."},
        {t:"on Saturdays", r:"l", e:"**On Saturdays** = jeden Samstag → simple present."},
        {t:"last night", r:"r", e:"**last night** = gestern Abend → simple past."},
        {t:"when I was six", r:"r", e:"**when I was …** → simple past."},
        {t:"often", r:"l", e:"**Often** → a habit: simple present."},
        {t:"an hour ago", r:"r", e:"**ago** → simple past."}
      ]},
    { id:"edlab", typ:"sortieren", icon:"🏛️", titel:"Roman -ed Lab", art:"Regular verbs · sort",
      anleitung:"How do you write the **-ed** form? Tap the right box.",
      anleitungDe:"Wie schreibt man die **-ed**-Form? Tippe auf das richtige Kästchen.",
      tipp:"Achte auf das Ende des Verbs: -e, Konsonant + y, oder kurzes Verb mit Vokal + Konsonant.",
      koerbe:[
        {t:"+ ed", info:"jump → jumped", tipp:"Most verbs just get **-ed**: jump → jumped. Vowel + y also just gets -ed: play → played."},
        {t:"+ d", info:"love → loved", tipp:"Verbs ending in **-e** only get **-d**: like → liked."},
        {t:"y → ied", info:"hurry → hurried", tipp:"**Consonant + y** → **ied**: cry → cried. But vowel + y stays: play → played."},
        {t:"double + ed", info:"rob → robbed", tipp:"Short verbs with **vowel + consonant** at the end double the last letter: stop → stopped."}
      ],
      items:[
        {t:"play", k:0, e:"play → **played** (vowel + y: just add -ed)"},
        {t:"watch", k:0}, {t:"clean", k:0}, {t:"help", k:0},
        {t:"live", k:1}, {t:"dance", k:1}, {t:"like", k:1}, {t:"smile", k:1},
        {t:"study", k:2}, {t:"carry", k:2}, {t:"cry", k:2}, {t:"try", k:2},
        {t:"stop", k:3}, {t:"plan", k:3}, {t:"drop", k:3}, {t:"hug", k:3}
      ]},
    { id:"memory", typ:"memory", icon:"🏰", titel:"Castle Memory", art:"Irregular verbs · memory",
      anleitung:"Find the pairs: **verb + past form**. Fewer moves = more flags.",
      anleitungDe:"Finde die Paare: **Verb + Vergangenheitsform**. Je weniger Züge du brauchst, desto mehr Flaggen bekommst du.",
      tipp:"Diese Verben sind unregelmäßig. Sie bekommen kein -ed – du musst sie auswendig lernen.",
      paare:[
        {a:"go", b:"went"}, {a:"see", b:"saw"}, {a:"eat", b:"ate"}, {a:"have", b:"had"},
        {a:"buy", b:"bought"}, {a:"take", b:"took"}, {a:"come", b:"came"}, {a:"write", b:"wrote"}
      ]},
    { id:"rush", typ:"rush", icon:"🚀", titel:"Moon Rush", art:"Speed game · 60 seconds",

      items:[

        {q:"buy", o:["bought","buyed","brought"], c:0}, {q:"take", o:["took","taked","taken"], c:0},
        {q:"come", o:["came","comed","comes"], c:0}, {q:"write", o:["wrote","writed","written"], c:0},
        {q:"make", o:["made","maked","makes"], c:0}, {q:"get", o:["got","getted","geted"], c:0},
        {q:"give", o:["gave","gived","given"], c:0}, {q:"find", o:["found","finded","fand"], c:0},
        {q:"run", o:["ran","runned","run"], c:0}, {q:"swim", o:["swam","swimmed","swum"], c:0},
        {q:"sing", o:["sang","singed","sung"], c:0}, {q:"drink", o:["drank","drinked","drunk"], c:0},
        {q:"sleep", o:["slept","sleeped","slapt"], c:0}, {q:"meet", o:["met","meeted","meat"], c:0},
        {q:"play", o:["played","plaied","playd"], c:0}, {q:"stop", o:["stopped","stoped","stopt"], c:0},
        {q:"study", o:["studied","studyed","studid"], c:0}, {q:"live", o:["lived","liveed","livd"], c:0},
        {q:"be (I / he / she / it)", o:["was","were","been"], c:0}, {q:"be (we / you / they)", o:["were","was","be"], c:0}
      ]},
    { id:"london", typ:"lueckentext", icon:"🎡", titel:"London Story", art:"Story · fill in the gaps",
      anleitung:"Tap a gap and choose the **simple past** of the verb in brackets.",
      anleitungDe:"Tippe auf eine Lücke und wähle die **Simple-Past-Form** des Verbs in Klammern.",
      tipp:"*was* steht bei I, he, she, it – *were* bei we, you, they.",
      ueberschrift:"My trip to London",
      text:"Last summer my family and I (go) [[went|goed|go]] to London. We (be) [[were|was|are]] there for five days. On the first day we (visit) [[visited|visitted|visit]] the Tower of London. It (be) [[was|were|is]] very old and a bit scary! My little brother (see) [[saw|seed|sees]] the crown jewels and (say) [[said|sayed|says]]: “Wow!”\nIn the afternoon we (take) [[took|taked|take]] a boat on the river. I (eat) [[ate|eated|eat]] fish and chips. It (taste) [[tasted|tastet|tastes]] great. In the evening we (be) [[were|was|be]] really tired, so we (stay) [[stayed|staied|stay]] in the hotel.",

    { id:"pirate", typ:"satzbau", icon:"🏴‍☠️", titel:"Pirate Code", art:"Sentence builder · didn’t & Did …?",

      saetze:[

        {w:["She","didn't","go","to","school","on","Monday"], alt:[["On","Monday","she","didn't","go","to","school"]], hint:"🇩🇪 Sie ist am Montag nicht zur Schule gegangen."},
        {w:["Did","you","see","the","film","?"], hint:"🇩🇪 Hast du den Film gesehen?"},
        {w:["Did","they","visit","London","last","summer","?"], hint:"🇩🇪 Haben sie letzten Sommer London besucht?"},
        {w:["We","didn't","have","breakfast","this","morning"], alt:[["This","morning","we","didn't","have","breakfast"]], hint:"🇩🇪 Wir haben heute Morgen nicht gefrühstückt."},
        {w:["Where","did","you","go","last","weekend","?"], hint:"🇩🇪 Wohin bist du letztes Wochenende gegangen?"}
      ]},
    { id:"mistake", typ:"quiz", icon:"🕵️", titel:"Spot the Mistake", art:"Quiz · which sentence is right?",
      anleitung:"Only **one** sentence is correct. Find it!",
      anleitungDe:"Nur **ein** Satz ist richtig. Finde ihn!",
      tipp:"Achte auf did/didn’t + Grundform, auf was/were und auf die Schreibweise.",
      fragen:[

        {q:"Which sentence is correct?", o:["Did you saw Tom?","Did you see Tom?","Do you saw Tom?","Did you seen Tom?"], c:1, e:"Did + person + base form: Did you **see** Tom?"},
        {q:"Which sentence is correct?", o:["We was at the zoo.","We were at the zoo.","We is at the zoo yesterday.","We be at the zoo."], c:1, e:"we → **were**."},
        {q:"Which sentence is correct?", o:["He played tennis last week.","He plaied tennis last week.","He play tennis last week.","He playd tennis last week."], c:0, e:"play ends in vowel + y → just add -ed: **played**."},
        {q:"Which sentence is correct?", o:["The bus stoped.","The bus stopped.","The bus stopt.","The bus stoping."], c:1, e:"stop → **stopped** (double the p)."},
        {q:"Which sentence is correct?", o:["My sister buyed a bike.","My sister bought a bike.","My sister brought a bike.","My sister buys a bike yesterday."], c:1, e:"buy → **bought**. Careful: *brought* is the past of *bring*!"}
      ]}
