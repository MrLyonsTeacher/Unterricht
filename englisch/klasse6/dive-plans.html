        {t:"am", info:"I", tipp:"**I am** (I’m) going to …"},
        {t:"is", info:"he · she · it", tipp:"**he / she / it is** going to … – also after one person: *Lisa is going to …*"},
        {t:"are", info:"we · you · they", tipp:"**we / you / they are** going to … – also after two people: *Tom and Ali are going to …*"}
      ],
      items:[
        {t:"I ___ going to swim.", k:0}, {t:"She ___ going to buy flippers.", k:1}, {t:"We ___ going to visit an island.", k:2},
        {t:"My dad ___ going to rent a boat.", k:1, e:"*My dad* = he → **is**."}, {t:"They ___ going to take photos.", k:2}, {t:"It ___ going to be a great day.", k:1},
        {t:"You ___ going to love it!", k:2}, {t:"Tom and Ali ___ going to bring a ball.", k:2, e:"*Tom and Ali* = they → **are**."}, {t:"I ___ not going to forget my towel.", k:0},

        {t:"The kids ___ going to build a sandcastle.", k:2}
