    isles: { titel:"UK, Great Britain or British Isles?", folien:[
      {bild:"🏝️", titel:"The British Isles", text:"The **British Isles** are a group of islands in the north-west of Europe. The two big islands are **Great Britain** and **Ireland**. There are also many small islands.", de:"Die **Britischen Inseln** sind eine Inselgruppe im Nordwesten Europas. Die zwei großen Inseln heißen **Great Britain** und **Ireland**. Dazu kommen viele kleine Inseln."},
      {bild:"🗺️", titel:"Great Britain", text:"**Great Britain** is the biggest island. Three countries are on it: **England**, **Scotland** and **Wales**.", de:"**Great Britain** ist die größte Insel. Auf ihr liegen drei Länder: **England**, **Schottland** und **Wales**."},
      {bild:"🇬🇧", titel:"The United Kingdom (UK)", text:"The **UK** is one state with four parts: England, Scotland, Wales and **Northern Ireland**. Its full name is *the United Kingdom of Great Britain and Northern Ireland*. The capital is **London**.", de:"Das **UK** ist ein Staat mit vier Teilen: England, Schottland, Wales und **Nordirland**. Der volle Name ist *the United Kingdom of Great Britain and Northern Ireland*. Die Hauptstadt ist **London**."},
      {bild:"🇮🇪", titel:"The Republic of Ireland", text:"The **Republic of Ireland** is an independent country – it is **not** part of the UK. It is in the EU, so people in Dublin pay with **euros**. In Northern Ireland (UK) people pay with **pounds**.", de:"Die **Republik Irland** ist ein eigener Staat – sie gehört **nicht** zum UK. Sie ist in der EU, darum zahlt man in Dublin mit **Euro**. In Nordirland (UK) zahlt man mit **Pfund**."},
      {bild:"👑", titel:"The King", text:"The head of state of the UK is **King Charles III**. He became king in 2022 after his mother, **Queen Elizabeth II**, died. The country is led by the **Prime Minister** and Parliament.", de:"Staatsoberhaupt des UK ist **König Charles III.** Er wurde 2022 König, nachdem seine Mutter **Queen Elizabeth II** gestorben war. Regiert wird das Land vom **Prime Minister** und dem Parlament."}

    countries: { titel:"Five countries – one tour", folien:[

      {bild:"🏴󠁧󠁢󠁳󠁣󠁴󠁿", titel:"Scotland", text:"Capital: **Edinburgh** with its castle on a rock. The biggest city is **Glasgow**. **Loch Ness** is a long lake – famous for “Nessie”. **Ben Nevis** (1,345 m) is the highest mountain in the UK. Food: **haggis**. Sport: the **Highland Games**. Symbol: the **thistle**.", de:"Hauptstadt: **Edinburgh** mit der Burg auf einem Felsen. Größte Stadt: **Glasgow**. **Loch Ness** ist ein langer See – bekannt für „Nessie“. **Ben Nevis** (1.345 m) ist der höchste Berg im UK. Essen: **Haggis**. Sport: die **Highland Games**. Symbol: die **Distel**."},

      {bild:"🚢", titel:"Northern Ireland", text:"Capital: **Belfast**. The **Titanic** was built there – today you can visit the **Titanic Belfast** museum. On the coast is the **Giant’s Causeway** with about 40,000 stone columns. Northern Ireland is part of the **UK**.", de:"Hauptstadt: **Belfast**. Dort wurde die **Titanic** gebaut – heute gibt es das Museum **Titanic Belfast**. An der Küste liegt der **Giant’s Causeway** mit etwa 40.000 Steinsäulen. Nordirland gehört zum **UK**."},
      {bild:"☘️", titel:"Republic of Ireland", text:"Capital: **Dublin** – famous for the big **St Patrick’s Day** parade. On the west coast are the **Cliffs of Moher** and the city of **Galway**. Symbol: the **shamrock**.", de:"Hauptstadt: **Dublin** – bekannt für die große Parade am **St Patrick’s Day**. An der Westküste liegen die **Cliffs of Moher** und die Stadt **Galway**. Symbol: das **Kleeblatt** (shamrock)."}
