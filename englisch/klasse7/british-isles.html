body{background-color:var(--bg);

.stamps{position:absolute;right:clamp(.5rem,3vw,2rem);top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(2,auto);gap:.4rem .6rem}
.stamp-c{width:92px;height:92px;border-radius:50%;border:3px dashed rgba(255,255,255,.85);display:grid;place-items:center;text-align:center;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;padding:.4rem;color:#fff;background:rgba(255,255,255,.06)}
