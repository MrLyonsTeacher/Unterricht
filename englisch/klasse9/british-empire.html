      {bild:"🌍", titel:"The biggest empire ever", text:"Around **1920** the British Empire was the **largest empire in history**. It ruled about **a quarter of the world’s land** and about a quarter of its people.", de:"Um **1920** war das Britische Weltreich das **größte Reich der Geschichte**. Es beherrschte etwa **ein Viertel der Landfläche** der Erde und etwa ein Viertel der Menschen."},
      {bild:"☀️", titel:"“The empire on which the sun never sets”", text:"The empire had colonies on **every continent**. So somewhere it was always daytime – that’s why people called it *the empire on which the sun never sets*.", de:"Das Reich hatte Kolonien auf **allen Kontinenten**. Irgendwo war also immer Tag – deshalb nannte man es *das Reich, in dem die Sonne nie untergeht*."},
      {bild:"⛵", titel:"How it started", text:"In **1600** the **East India Company** was founded to trade with Asia. In **1607** English settlers built **Jamestown** in North America – the first lasting English colony there.", de:"**1600** wurde die **East India Company** gegründet, um mit Asien zu handeln. **1607** bauten englische Siedler **Jamestown** in Nordamerika – die erste dauerhafte englische Kolonie dort."},
      {bild:"🇺🇸", titel:"Losing America", text:"The American colonies did not want to pay British taxes without a say. In **1776** they declared **independence** and became the **USA**.", de:"Die amerikanischen Kolonien wollten keine britischen Steuern ohne Mitsprache zahlen. **1776** erklärten sie ihre **Unabhängigkeit** und wurden die **USA**."},
      {bild:"🦘", titel:"Australia", text:"In **1788** the **First Fleet** arrived in Sydney with many **convicts** (prisoners). But **Aboriginal people** had lived in Australia for more than 50,000 years. They lost much of their land.", de:"**1788** kam die **First Fleet** mit vielen **Sträflingen** in Sydney an. Aber **Aborigines** lebten schon seit über 50.000 Jahren in Australien. Sie verloren einen großen Teil ihres Landes."},

      {bild:"🐘", titel:"India – “the jewel in the crown”", text:"From **1858** the British Crown ruled **India** directly. In **1947** India and Pakistan became **independent** – after a long, mostly peaceful struggle led by **Mahatma Gandhi** and others.", de:"Ab **1858** regierte die britische Krone **Indien** direkt. **1947** wurden Indien und Pakistan **unabhängig** – nach einem langen, meist gewaltfreien Kampf, angeführt u. a. von **Mahatma Gandhi**."},
