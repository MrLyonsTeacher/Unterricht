<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Digitale Materialien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F2F4F3; --surface:#FFFFFF; --ink:#18231F; --muted:#56625D; --line:#D3DAD7;
  --accent:#1E6B52; --accent-ink:#FFFFFF;
  --en:#2F5DA8; --sp:#D0601A; --so:#6B5AA8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111816; --surface:#1B2421; --ink:#E6ECE9; --muted:#9EABA6; --line:#2E3A36;
    --accent:#3FAF88; --accent-ink:#0B1411;
    --en:#7EA6EA; --sp:#F08A48; --so:#A999E6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111816; --surface:#1B2421; --ink:#E6ECE9; --muted:#9EABA6; --line:#2E3A36;
  --accent:#3FAF88; --accent-ink:#0B1411;
  --en:#7EA6EA; --sp:#F08A48; --so:#A999E6;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.0625rem;line-height:1.5}
main{max-width:920px;margin:0 auto;padding:1.5rem 1rem 3rem}
h1{font-size:clamp(1.9rem,5vw,2.6rem);margin:0 0 .2rem;line-height:1.1}
.sub{color:var(--muted);margin:0 0 1.4rem}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.2rem}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:.5rem 1.1rem;min-height:44px;font-weight:700}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.section{margin:1.6rem 0}
.section h2{font-size:1.35rem;margin:0 0 .7rem;display:flex;align-items:center;gap:.55rem}
.section h2::before{content:"";width:.8rem;height:.8rem;border-radius:3px;background:var(--c)}
.list{display:grid;gap:.6rem}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:.85rem 1rem;
  display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.item .txt{flex:1 1 260px;min-width:0}
.item b{display:block}
.item span{color:var(--muted);font-size:.95rem}
.actions{display:flex;gap:.5rem}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:.6rem 1rem;min-height:46px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:.85rem 1rem;margin:0}

.own{margin-top:2.2rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem}
.own h2{font-size:1.2rem;margin:0 0 .3rem}
.own p{margin:0 0 .7rem;color:var(--muted)}
.own form{display:flex;gap:.5rem;flex-wrap:wrap}
.own input{flex:1 1 280px;min-height:46px;border:2px solid var(--line);border-radius:10px;padding:.5rem .8rem;background:var(--bg)}

.warn{background:#FFF3D6;color:#5A4300;border-radius:10px;padding:.7rem 1rem;margin-bottom:1rem}

/* QR-Ansicht für Beamer/Tafel */
dialog{border:0;padding:0;width:100vw;height:100dvh;max-width:none;max-height:none;background:#fff;color:#111}
dialog::backdrop{background:#000}
.qrwrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.2rem;text-align:center}
.qrwrap h2{margin:0;font-size:clamp(1.6rem,4.5vw,3rem);line-height:1.1}
#qr{width:min(70vh,82vw);height:min(70vh,82vw);image-rendering:pixelated}
.qrurl{font-size:clamp(.9rem,2vw,1.2rem);color:#444;word-break:break-all;max-width:90vw}
.qrbar{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.qrbar .btn{background:#1E6B52;color:#fff}
.qrbar .btn.ghost{background:#fff;color:#111;border:1px solid #bbb}
.toast{min-height:1.4em;color:#1E6B52;font-weight:700;margin:0}
</style>
</head>
<body>
<main>
  <h1>Digitale Materialien</h1>
  <p class="sub">Material auswählen, QR-Code zeigen, die Klasse scannt mit dem iPad.</p>
  <p style="margin:-.6rem 0 1.4rem"><a class="btn" href="ergebnisse.html">Ergebnisse einsammeln &amp; Klassenübersicht</a></p>
  <div id="warn"></div>
  <div class="tabs" role="group" aria-label="Bereich wählen" id="tabs"></div>
  <div id="sections"></div>

  <section class="own">
    <h2>QR-Code für einen anderen Link</h2>
    <p>Zum Beispiel für ein Video, eine LearningApp oder einen Moodle-Kurs.</p>
    <form id="ownForm">
      <input type="url" id="ownUrl" placeholder="https://…" required aria-label="Link">
      <button class="btn" type="submit">QR-Code zeigen</button>
    </form>
  </section>
</main>

<dialog id="dlg" aria-labelledby="qrTitle">
  <div class="qrwrap">
    <h2 id="qrTitle"></h2>
    <img id="qr" alt="QR-Code">
    <div class="qrurl" id="qrUrl"></div>
    <div class="qrbar">
      <button class="btn" id="copy">Link kopieren</button>
      <a class="btn ghost" id="dl" download="qr-code.png">QR als Bild speichern</a>
      <button class="btn ghost" id="close">Schließen</button>
    </div>
    <p class="toast" id="toast" role="status"></p>
  </div>
</dialog>

<script src="qrcode.js"></script>
<script src="materialien.js"></script>
<script>
const BEREICHE = [
  {name:"Englisch", farbe:"var(--en)"},
  {name:"Sport", farbe:"var(--sp)"},
  {name:"Sonstiges", farbe:"var(--so)"}
];
let filter = "Alle";
try{ filter = localStorage.getItem("hub-filter") || "Alle"; }catch(e){}

const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const abs = p => new URL(p, location.href).href;

if(location.protocol === "file:"){
  document.getElementById("warn").innerHTML = `<p class="warn">Diese Seite ist gerade nur als Datei auf deinem Gerät geöffnet. QR-Codes funktionieren für die Schüler erst, wenn die Seite online ist (z. B. über GitHub Pages).</p>`;
}

function renderTabs(){
  document.getElementById("tabs").innerHTML = ["Alle", ...BEREICHE.map(b=>b.name)]
    .map(n=>`<button class="tab" data-tab="${n}" aria-pressed="${filter===n}">${n}</button>`).join("");
}
function renderSections(){
  const list = (typeof MATERIALIEN !== "undefined" ? MATERIALIEN : []);
  document.getElementById("sections").innerHTML = BEREICHE
    .filter(b => filter==="Alle" || filter===b.name)
    .map(b=>{
      const items = list.map((m,i)=>({...m,i})).filter(m=>m.bereich===b.name);
      const body = items.length
        ? `<div class="list">${items.map(m=>`
            <div class="item">
              <div class="txt"><b>${esc(m.titel)}</b>${m.info?`<span>${esc(m.info)}</span>`:""}</div>
              <div class="actions">
                <button class="btn" data-qr="${m.i}">QR-Code</button>
                <a class="btn ghost" href="${esc(m.pfad)}" target="_blank" rel="noopener">Öffnen</a>
              </div>
            </div>`).join("")}</div>`
        : `<p class="empty">Noch kein Material in diesem Bereich.</p>`;
      return `<section class="section" style="--c:${b.farbe}"><h2>${b.name}</h2>${body}</section>`;
    }).join("");
}

function showQR(title, url){
  const qr = qrcode(0, "M");
  qr.addData(url, "Byte");
  qr.make();
  const src = qr.createDataURL(12, 2);
  document.getElementById("qrTitle").textContent = title;
  document.getElementById("qr").src = src;
  document.getElementById("qrUrl").textContent = url;
  document.getElementById("dl").href = src;
  document.getElementById("dl").download = "QR " + title.replace(/[^\wäöüÄÖÜß -]/g,"").trim() + ".png";
  document.getElementById("toast").textContent = "";
  document.getElementById("dlg").dataset.url = url;
  document.getElementById("dlg").showModal();
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab]");
  if(t){ filter=t.dataset.tab; try{localStorage.setItem("hub-filter",filter)}catch(err){} renderTabs(); renderSections(); return; }
  const q = e.target.closest("[data-qr]");
  if(q){ const m = MATERIALIEN[+q.dataset.qr]; showQR(m.titel, abs(m.pfad)); return; }
});
document.getElementById("ownForm").addEventListener("submit", e=>{
  e.preventDefault();
  const u = document.getElementById("ownUrl").value.trim();
  if(u) showQR("Link öffnen", u);
});
document.getElementById("close").onclick = ()=>document.getElementById("dlg").close();
document.getElementById("copy").onclick = async ()=>{
  const url = document.getElementById("dlg").dataset.url;
  try{ await navigator.clipboard.writeText(url); document.getElementById("toast").textContent = "Link kopiert"; }
  catch(err){ document.getElementById("toast").textContent = "Kopieren nicht möglich – Link bitte markieren"; }
};

renderTabs();
renderSections();
</script>
</body>
</html>
