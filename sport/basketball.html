<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lernwelt/lernwelt.css">
<style>
:root{
  color-scheme:light;
  --bg:#E7ECF4; --surface:#FFFFFF; --surface-2:#F2F5FA; --ink:#0E1A3D; --muted:#55627E; --line:#CBD4E3;
  --accent:#EE5F17; --accent-ink:#FFFFFF; --accent-2:#FFD35C; --mid-bg:#FFF1CC;
  --ok:#14834F; --ok-bg:#DCF2E5; --bad:#C8352A; --bad-bg:#FBE2DE;
  --court:#13296B; --maple:#E2B77A;
  --radius:18px; --radius-btn:14px; --radius-ic:14px;
  --border:1px solid #D5DCE9; --shadow:0 3px 0 #CBD4E3; --border-opt:2px solid #D5DCE9;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --display-weight:800; --display-transform:uppercase; --display-tracking:.01em;
  --ic-bg:var(--court); --card-back:var(--court); --tile-bg:#FFE3D1; --tile-ink:#0E1A3D;
  --chip-bg:var(--court); --chip-ink:#fff; --how-bg:#FFFFFF; --border-soft:1px solid #D5DCE9;
  --track:#DCE2EC; --star:#F2A50C; --star-off:#D3DAE6;
}
body{background:var(--bg) radial-gradient(circle at 100% 0,rgba(238,95,23,.08),transparent 40%)}
.lhead h1,.disp{font-style:italic}
.chip{border:0}

/* Startbild: das Spielfeld */
.court-hero{position:relative;overflow:hidden;border-radius:24px;background:var(--court);color:#fff;padding:clamp(1.4rem,4vw,2.4rem);min-height:250px;isolation:isolate}
.court-hero svg.lines{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.9}
.court-hero .kicker{font-family:var(--font-display);font-weight:800;font-style:italic;font-size:1.3rem;color:var(--accent-2);margin:0}
.court-hero h1{font-family:var(--font-display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(2.8rem,10vw,5.4rem);line-height:.9;margin:.3rem 0 .7rem;max-width:9ch}
.court-hero p{margin:0;max-width:40ch;color:#D6DEF5;font-size:1.08rem}
.court-hero .ball{position:absolute;right:clamp(-30px,2vw,30px);bottom:-40px;width:clamp(150px,30vw,250px);z-index:-1}
@media (max-width:560px){ .court-hero .ball{opacity:.5} }
</style>
</head>
<body>
<main class="lw" id="app"></main>

<script src="../qrcode.js"></script>
<script src="../ergebnis.js"></script>
<script src="../lernwelt/lernwelt.js"></script>
